apiVersion: v1
data:
  01-init.js: |
    // Runs once, on MongoDB's first start with an empty data volume. `db` is the podradar database.

    const WEEK_IN_SECONDS = 7 * 24 * 60 * 60;

    // The server's user: read and write on podradar only, never root
    db.createUser({
      user: process.env.MONGO_APP_USERNAME,
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: db.getName() }],
    });

    // Cluster events; the TTL index deletes them after a week
    db.createCollection("events");
    db.events.createIndex({ timestamp: 1 }, { expireAfterSeconds: WEEK_IN_SECONDS });

    // How long each lost pod took to be replaced; also kept for a week
    db.createCollection("recoveries");
    db.recoveries.createIndex({ recovered_at: 1 }, { expireAfterSeconds: WEEK_IN_SECONDS });
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: podradar
